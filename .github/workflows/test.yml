name: Tests

on:
  pull_request:
  push:

jobs:
  portfolio-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run portfolio contract tests
        run: python3 -m unittest discover -s tests -v
